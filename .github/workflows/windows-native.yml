name: Plattform-Praxistest
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Native test suite
        type: choice
        options: [all, windows, unix, mac-managers]
        default: all
permissions: {}
jobs:
  platforms:
    uses: ./.github/workflows/native-platforms.yml
    with:
      suite: ${{ inputs.suite }}
