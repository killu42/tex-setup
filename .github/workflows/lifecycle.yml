name: PDF lifecycle
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, windows, windows-publisher, linux, mac, intel]
        description: Systeme fuer den vollstaendigen Installationstest
permissions:
  contents: read
jobs:
  windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' || inputs.platform == 'windows-publisher' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.platform == 'windows-publisher' && fromJSON('["windows-2025"]') || fromJSON('["windows-2025","windows-11-arm"]') }}
        scenario: ${{ inputs.platform == 'windows-publisher' && fromJSON('["publisher-refused"]') || fromJSON('["fresh","legacy"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: powershell
        run: ./test-pdf-windows.ps1 -Scenario ${{ matrix.scenario }}
  unix:
    if: ${{ inputs.platform != 'windows' && inputs.platform != 'windows-publisher' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.platform == 'intel' && fromJSON('["macos-15-intel"]') || inputs.platform == 'linux' && fromJSON('["ubuntu-24.04"]') || inputs.platform == 'mac' && fromJSON('["macos-15","macos-15-intel"]') || fromJSON('["ubuntu-24.04","macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: bash
        env:
          TEST_REF: ${{ github.sha }}
          TEST_PLATFORM: ${{ matrix.os == 'ubuntu-24.04' && 'linux' || matrix.os == 'macos-15-intel' && 'intel' || 'mac' }}
          NONINTERACTIVE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
          DEBIAN_FRONTEND: noninteractive
        run: bash test-pdf-unix.sh
