name: PDF lifecycle
on:
  push:
    paths: ['mac.sh', 'win.ps1']
  workflow_dispatch:
    inputs:
      linux_only:
        type: boolean
        default: false
        description: Nur Linux (z.B. nach einer Linux-Befehlsaenderung)
permissions:
  contents: read
jobs:
  windows:
    if: ${{ !inputs.linux_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        scenario: [fresh, legacy]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: powershell
        run: ./test-pdf-windows.ps1 -Scenario ${{ matrix.scenario }}
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.linux_only && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04","macos-15","macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - shell: bash
        env:
          TEST_REF: ${{ github.sha }}
          TEST_PLATFORM: ${{ matrix.os == 'ubuntu-24.04' && 'linux' || matrix.os == 'macos-15-intel' && 'intel' || 'mac' }}
          NONINTERACTIVE: '1'
          HOMEBREW_NO_ANALYTICS: '1'
          DEBIAN_FRONTEND: noninteractive
        run: bash test-pdf-unix.sh
