name: Simple setup validation
on:
  pull_request:
    paths: ['simple/**', '.github/workflows/simple-native.yml']
  workflow_dispatch:
permissions: {}
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
        scenario: [fresh, legacy]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Install, repair shortcut, repeat, launch, compile and remove
        shell: powershell
        env:
          TEST_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          SCENARIO: ${{ matrix.scenario }}
        run: |
          $ErrorActionPreference='Stop'
          $test=Invoke-RestMethod "https://raw.githubusercontent.com/killu42/tex-setup/$env:TEST_REF/simple/test-native.ps1"
          & ([scriptblock]::Create($test)) -Scenario $env:SCENARIO
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node simple/test-simple.mjs
      - run: pwsh -NoProfile -File simple/test-simple.ps1
